version: '3.8'
services:
  mysql57:
    image: mysql:8.0.29
    restart: unless-stopped
    container_name: db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: market_management
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/src
    environment:
      FLASK_APP: run.py
      FLASK_ENV: development
    depends_on:
      - mysql57

volumes:
  mysql_data: