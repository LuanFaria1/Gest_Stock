
version: '3'
services:
  mysql57:
    image: mysql:8.0.29
    container_name: db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306" 
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: market_managemen
    volumes:
      - .db:/var/lib/mysql

  web:
    build:
      context: .  
      dockerfile: Dockerfile 
    container_name: flask_app
    ports:
      - "5000:5000"
    volumes:
      - .:/src
    environment:
      FLASK_APP: run.py 
      FLASK_ENV: development
      MYSQL_HOST: mysql57
      MYSQL_PORT: 3306
    depends_on:
      - mysql57
